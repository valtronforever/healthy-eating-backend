# Local development environment: Postgres + the app with auto-reload.
# Usage: docker compose up --build

name: healthy-eating

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: healthy
      POSTGRES_PASSWORD: healthy
      POSTGRES_DB: healthy_eating
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthy -d healthy_eating"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://healthy:healthy@postgres:5432/healthy_eating
      TEST_DATABASE_URL: postgresql+asyncpg://healthy:healthy@postgres:5432/healthy_eating_test
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./tests:/app/tests
      - ./alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
