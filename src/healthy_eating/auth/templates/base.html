<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Healthy Eating{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; }
    main { width: min(24rem, 100% - 2rem); padding: 2rem 0; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { line-height: 1.5; color: GrayText; }
    .stack { display: grid; gap: 0.75rem; margin-top: 1.5rem; }
    .button, button {
      display: block; width: 100%; box-sizing: border-box; padding: 0.75rem 1rem;
      border: 1px solid GrayText; border-radius: 0.5rem; background: Canvas; color: CanvasText;
      font: inherit; text-align: center; text-decoration: none; cursor: pointer;
    }
    .button:hover, button:hover { border-color: CanvasText; }
    input {
      width: 100%; box-sizing: border-box; padding: 0.75rem; font: inherit;
      border: 1px solid GrayText; border-radius: 0.5rem;
    }
    .muted { font-size: 0.875rem; }
    .dev { margin-top: 2rem; padding-top: 1rem; border-top: 1px dashed GrayText; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
